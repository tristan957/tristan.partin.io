when:
  - event: [push, manual]
    branch: ["**"]

engine: microvm
image: nixos

dependencies:
  - devenv

steps:
  # The spindle clones with depth 1, but enableGitInfo in hugo.toml needs the
  # full history to compute each page's last modified date and commit
  - name: unshallow
    command: |
      if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
        git fetch --unshallow
      fi

  # devenv test builds outputs.site, so no separate build step is needed
  - name: check
    command: |
      set -e
      devenv tasks run openring:generate
      devenv test

  - name: deploy
    command: |
      set -e
      if [ "$TANGLED_PIPELINE_KIND" = pull_request ] || [ "$TANGLED_REF_NAME" != master ]; then
        echo "Not deploying $TANGLED_REF_NAME"
        exit 0
      fi
      devenv tasks run site:deploy --input target=production
