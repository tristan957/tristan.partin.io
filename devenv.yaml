imports:
  - resume

inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:nixos/nixpkgs/nixpkgs-unstable
  resume:
    url: git+https://tangled.org/tristan.partin.io/resume
    flake: false
  talks:
    url: git+https://tangled.org/tristan.partin.io/talks
    inputs:
      git-hooks:
        follows: git-hooks
      nixpkgs:
        follows: nixpkgs
      treefmt-nix:
        follows: treefmt-nix
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
